{% extends "auth_base.html" %}

{% block title %}Sign Up | RecipeHub{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card auth-card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-2">Create Your Account</h2>
                            <p class="text-muted mb-0">Join RecipeHub and start sharing your recipes</p>
                        </div>

                        <form method="POST" action="{{ url_for('auth.signup') }}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control form-control-lg rounded-3" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control form-control-lg rounded-3" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg rounded-3" name="password" required>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-success btn-lg rounded-3 fw-semibold">Create Account</button>
                            </div>

                            <p class="text-center text-muted mb-0">
                                Already have an account?
                                <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Login</a>
                            </p>
                        </form>
                    </div>
                </div>

                <p class="text-center text-muted mt-4 small">
                    Your recipes, notes, and favorites in one place
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
