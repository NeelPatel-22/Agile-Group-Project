{% extends "base.html" %}

{% block title %}Add Recipe | RecipeHub{% endblock %}

{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/add_recipe.css') }}">{% endblock %}

{% block content %}
<section class="page-section profile-page">
  <div class="container">
    <div class="add-recipe-shell">
      <div class="profile-summary-card section-card">
        <div class="panel-body">
          <div class="add-recipe-header">
            <div>
              <h2 class="section-title">Add Recipe</h2>
              <p class="profile-bio mb-0">Create a richer recipe post with quick details, flavor notes, ingredients, and step-by-step instructions.</p>
            </div>
            <a href="{{ url_for('main.profile') }}" class="btn btn-outline">Back to Profile</a>
          </div>

          <form id="recipe-create-form" enctype="multipart/form-data">
            <div class="meta-grid form-grid">
              <div>
                <label class="form-label">Recipe title</label>
                <input type="text" name="title" class="form-control" required>
              </div>
              <div>
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" placeholder="Comfort Food, Salad, Dinner">
              </div>
              <div>
                <label class="form-label">Cook time</label>
                <input type="text" name="cook_time" class="form-control" placeholder="35 Minutes">
              </div>
              <div>
                <label class="form-label">Servings</label>
                <input type="text" name="servings" class="form-control" placeholder="4 Servings">
              </div>
              <div>
                <label class="form-label">Upload image</label>
                <input type="file" name="image_file" id="image-file-input" class="form-control" accept=".png,.jpg,.jpeg,.gif,.webp">
              </div>
              <div class="full-span">
                <label class="form-label">Recipe introduction</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Write the short subtitle shown under the recipe title." required></textarea>
              </div>
              <div class="full-span">
                <label class="form-label">Why people love it</label>
                <textarea name="why_people_love_it" class="form-control" rows="3" placeholder="Explain what makes this recipe special or easy to make."></textarea>
              </div>
              <div>
                <label class="form-label">Flavor</label>
                <input type="text" name="flavor_notes" class="form-control" placeholder="Creamy, sweet, and savory">
              </div>
              <div>
                <label class="form-label">Skill level</label>
                <input type="text" name="skill_level" class="form-control" placeholder="Beginner friendly">
              </div>
              <div>
                <label class="form-label">Best for</label>
                <input type="text" name="best_for" class="form-control" placeholder="Family dinner or meal prep">
              </div>
              <div>
                <label class="form-label">Pair with</label>
                <input type="text" name="pair_with" class="form-control" placeholder="Lemon salad and sparkling water">
              </div>
              <div>
                <label class="form-label">Spice level</label>
                <input type="text" name="spice_level" class="form-control" placeholder="Mild by default">
              </div>
              <div>
                <label class="form-label">Dietary cautions</label>
                <input type="text" name="dietary_cautions" class="form-control" placeholder="Contains dairy and gluten">
              </div>
              <div>
                <label class="form-label">Ingredients</label>
                <textarea name="ingredients" class="form-control" rows="6" placeholder="One ingredient per line" required></textarea>
              </div>
              <div>
                <label class="form-label">Steps</label>
                <textarea name="steps" class="form-control" rows="6" placeholder="One step per line" required></textarea>
              </div>
              <div class="full-span">
                <label class="form-label">Or image URL</label>
                <input type="url" name="image_url" class="form-control" placeholder="Optional external image link">
              </div>
            </div>
            <div class="upload-preview d-none mt-3" id="upload-preview">
              <img id="upload-preview-image" src="" alt="Recipe preview">
            </div>
            <button class="btn btn-primary mt-3">Post Recipe</button>
          </form>
          <div id="recipe-create-message" class="small mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
