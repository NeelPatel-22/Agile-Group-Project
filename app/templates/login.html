{% extends "auth_base.html" %}

{% block title %}Login | RecipeHub{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card auth-card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2">Welcome Back</h2>
              <p class="text-muted mb-0">Login to continue to your account</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input
                  type="email"
                  class="form-control form-control-lg rounded-3"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control form-control-lg rounded-3"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                >
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" name="remember">
                  <label class="form-check-label text-muted" for="remember">
                    Remember me
                  </label>
                </div>

                <a href="#" class="text-decoration-none small fw-semibold">Forgot password?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-success btn-lg rounded-3 fw-semibold">
                  Login
                </button>
              </div>

              <p class="text-center text-muted mb-0">
                Don’t have an account?
                <a href="{{ url_for('auth.signup') }}" class="text-decoration-none fw-semibold">Sign up</a>
              </p>
            </form>
          </div>
        </div>

        <p class="text-center text-muted mt-4 small">
          Secure access to your account
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
